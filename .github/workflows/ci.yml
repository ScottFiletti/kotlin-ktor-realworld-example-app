name: CI

on:
  push:
  pull_request:
    branches: [ master ]
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      # Finish both JDKs even if one fails, to show whether a failure is JDK-specific.
      fail-fast: false
      matrix:
        java: [ '17', '21' ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # Caches downloaded dependencies and the Gradle distribution between runs, and validates the
      # Gradle wrapper. Only builds on the default branch write the cache; other branches read it.
      - uses: gradle/actions/setup-gradle@v4

      # Compiles (to Java 17 bytecode on both JDKs, see build.gradle) and runs all tests. Each test's
      # result and a summary with one-line failure reasons go to the log and the run's summary page.
      - name: Build and test
        run: ./gradlew build

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report-jdk${{ matrix.java }}
          path: build/reports/tests/test/

  api-spec:
    # Bonus: the RealWorld Postman collection in spec-api/, run against the real app.
    # It fails only if an implemented endpoint fails; see spec-api/check-results.js.
    name: RealWorld API spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the app
        run: ./gradlew installDist

      - name: Start the app and wait until it answers
        run: |
          build/install/api/bin/api > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/tags > /dev/null && echo "App is up" && exit 0
            sleep 1
          done
          echo "App did not start within 60 seconds:"; cat app.log; exit 1

      # Not every request passes (unimplemented endpoints answer 501), so newman's own exit code is
      # ignored here; the next step decides pass/fail.
      - name: Run the spec collection
        run: APIURL=http://localhost:8080/api ./spec-api/run-api-tests.sh --reporters cli,json --reporter-json-export newman-report.json || true

      - name: Check implemented endpoints passed
        run: node spec-api/check-results.js newman-report.json

      - name: Upload spec report and app log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-spec-report
          path: |
            newman-report.json
            app.log
