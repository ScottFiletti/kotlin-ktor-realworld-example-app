plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.24'
    id 'application'
}

group 'io.realworld'
version '1.0-SNAPSHOT'

ext {
    slf4j_version = "2.0.9"
    ktor_version = "1.2.3"
    kodein_version = "6.1.0"
    hikaricp_version = "5.1.0"
    h2_version = "1.4.200"
    exposed_version = "0.17.14"
    junit_version = "4.13.2"
    unirest_version = "1.4.9"
}

application {
    mainClass = "io.realworld.app.AppKt"
}

// Compile for Java 17 whichever JDK runs the build (CI uses 17 and 21), so the output runs on both.
// Without this, a build on JDK 21 produces Java-21-only bytecode.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
}

repositories {
    mavenLocal()
    mavenCentral()
    // jcenter() removed (sunset). Exposed 0.14.1 was jcenter-only, hence the bump to 0.17.14.
}

dependencies {
    api "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    api "org.slf4j:slf4j-simple:$slf4j_version"
    api "io.ktor:ktor-server-netty:$ktor_version"
    api "io.ktor:ktor-server-cio:$ktor_version"
    api "io.ktor:ktor-jackson:$ktor_version"
    api "io.ktor:ktor-auth-jwt:$ktor_version"
    implementation "org.kodein.di:kodein-di-generic-jvm:$kodein_version"
    api "com.zaxxer:HikariCP:$hikaricp_version"
    api "com.h2database:h2:$h2_version"
    api "org.jetbrains.exposed:exposed:$exposed_version"

    testImplementation "junit:junit:$junit_version"
    testImplementation "com.mashape.unirest:unirest-java:$unirest_version"
}

test {
    useJUnit()
    testLogging {
        events "passed", "failed", "skipped"
        // "short" = exception type + message only; full stack traces are in build/reports/tests/test/index.html
        exceptionFormat "short"
        showStandardStreams = false
    }
    // Collect a one-line reason for each failure, then print a summary after the whole run.
    def failures = []
    afterTest { desc, result ->
        if (result.resultType == TestResult.ResultType.FAILURE) {
            def reason = result.exception?.message?.readLines()?.find { it.trim() } ?: result.exception?.class?.simpleName
            if (reason && reason.length() > 200) reason = reason.take(200) + "..."
            failures << "  - ${desc.className.tokenize('.').last()} > ${desc.name}: ${reason}"
        }
    }
    afterSuite { desc, result ->
        if (!desc.parent) { // desc.parent == null is the root suite, i.e. the whole run
            println "\nTest results: ${result.resultType} " +
                "(${result.testCount} tests, ${result.successfulTestCount} passed, " +
                "${result.failedTestCount} failed, ${result.skippedTestCount} skipped)"
            if (failures) println "Failed tests:\n" + failures.join("\n")

            // On GitHub Actions, also put the summary on the run's summary page.
            def summaryFile = System.getenv("GITHUB_STEP_SUMMARY")
            if (summaryFile) {
                def icon = result.resultType == TestResult.ResultType.SUCCESS ? "✅" : "❌"
                new File(summaryFile).append(
                    "## ${icon} Tests on JDK ${System.getProperty('java.version')}\n\n" +
                    "${result.testCount} tests: ${result.successfulTestCount} passed, " +
                    "${result.failedTestCount} failed, ${result.skippedTestCount} skipped " +
                    "(skipped tests are for endpoints not implemented yet; each states why).\n\n" +
                    (failures ? "**Failed tests:**\n\n" + failures.collect { it.replaceFirst(/^  - /, "- ") }.join("\n") + "\n\n" : ""),
                    "UTF-8")
            }
        }
    }
}
